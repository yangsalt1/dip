name: 데이터 매일 업데이트

on:
  schedule:
    # 한국시간 평일 오전 7:00 (미국장 마감 후) / 오후 4:00 (한국장 마감 후)
    - cron: '0 22 * * 0-4'
    - cron: '0 7 * * 1-5'
  workflow_dispatch: {}
  # 글(briefing)이나 코드를 올리면 시세도 바로 새로 받아오기
  push:
    branches: [main]
    paths-ignore:
      - 'data/market.json'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/update_market.py
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "dip-bot"
          git config user.email "dip-bot@users.noreply.github.com"
          git add data/market.json
          git diff --cached --quiet || git commit -m "data: 시장 데이터 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push
      - name: 청약 공고 새로 모으고 알림 보내기
        run: curl -s -m 70 https://jup-rosy.vercel.app/api/house/cron/ || true
