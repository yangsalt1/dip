name: app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/app.yml']

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install + sync
        working-directory: mobile
        run: npm ci && npx cap sync android
      - name: Debug APK (테스트 설치용)
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: jup-android-test-apk, path: mobile/android/app/build/outputs/apk/debug/app-debug.apk }

      - name: Release AAB (플레이스토어용)
        if: ${{ env.KS != '' }}
        working-directory: mobile/android
        run: |
          echo "$KS" | base64 -d > /tmp/upload.jks
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=/tmp/upload.jks \
            -Pandroid.injected.signing.store.password="$PW" \
            -Pandroid.injected.signing.key.alias=jup \
            -Pandroid.injected.signing.key.password="$PW"
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('mobile/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with: { name: jup-android-playstore-aab, path: mobile/android/app/build/outputs/bundle/release/app-release.aab }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install + sync
        working-directory: mobile
        run: npm ci && npx cap sync ios
      - name: Simulator build (서명 없이 빌드 확인)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -20
